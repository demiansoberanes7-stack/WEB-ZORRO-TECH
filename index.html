    <!-- ── Google Analytics (GA4 con filtro anti-bots y geo-fencing MX/USA) ── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X72PGXDZXK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // 1. Detección de navegadores headless / bots automatizados
      var isAutomatedBot = !!(
        navigator.webdriver ||
        window.__nightmare ||
        window.callPhantom ||
        window._phantom ||
        (window.chrome && !window.chrome.runtime && !window.chrome.loadTimes) ||
        !navigator.languages ||
        navigator.languages.length === 0 ||
        (window.screen && (window.screen.width === 0 || window.screen.height === 0)) ||
        (navigator.userAgent && /bot|crawl|spider|slurp|headless|phantom|selenium|puppeteer|lighthouse|curl|wget/i.test(navigator.userAgent))
      );

      // 2. Detección de zona horaria extranjera (Polonia: Europe/Warsaw, Francia: Europe/Paris, etc.)
      var isForeignZone = false;
      try {
        var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        if (/Europe|Asia|Africa|Australia|Etc\/UTC|^UTC$/i.test(tz)) {
          isForeignZone = true;
        }
      } catch (e) {}

      // Solo registrar en GA4 a usuarios reales de nuestra región geográfica
      if (!isAutomatedBot && !isForeignZone) {
        gtag('config', 'G-X72PGXDZXK');
      }

      // 3. Rastreo automático de eventos clave (WhatsApp, Redes, Teléfono, Correo, Servicios)
      document.addEventListener('click', function(e) {
        var el = e.target.closest('a, button');
        if (!el) return;
        var href = (el.getAttribute('href') || '').trim();
        var txt = (el.innerText || el.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').substring(0, 50);

        if (typeof gtag !== 'function') return;

        // Clic a WhatsApp
        if (href.indexOf('wa.me') !== -1 || href.indexOf('whatsapp.com') !== -1) {
          gtag('event', 'click_whatsapp', {
            event_category: 'conversion',
            page_path: window.location.pathname,
            link_url: href,
            button_text: txt
          });
        }
        // Clic a llamada telefónica
        else if (href.indexOf('tel:') === 0) {
          gtag('event', 'click_llamada', {
            event_category: 'conversion',
            page_path: window.location.pathname,
            phone_number: href.replace('tel:', ''),
            button_text: txt
          });
        }
        // Clic a correo
        else if (href.indexOf('mailto:') === 0) {
          gtag('event', 'click_email', {
            event_category: 'contacto',
            page_path: window.location.pathname,
            email: href.replace('mailto:', '').split('?')[0]
          });
        }
        // Clic a redes sociales
        else if (/facebook\.com|instagram\.com|tiktok\.com|linkedin\.com/i.test(href)) {
          var red = 'otra';
          if (/facebook/i.test(href)) red = 'facebook';
          else if (/instagram/i.test(href)) red = 'instagram';
          else if (/tiktok/i.test(href)) red = 'tiktok';
          else if (/linkedin/i.test(href)) red = 'linkedin';

          gtag('event', 'click_red_social', {
            event_category: 'social',
            platform: red,
            page_path: window.location.pathname,
            link_url: href
          });
        }
        // Clic en ver servicios o cotizar
        else if (href.indexOf('servicios') !== -1 || (el.id && el.id.indexOf('servicios') !== -1)) {
          gtag('event', 'ver_servicios', {
            event_category: 'interaccion',
            page_path: window.location.pathname,
            button_text: txt
          });
        }
      }, true);
    </script>
